<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Systems - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Dashboard Container -->
    <div class="dashboard-container active" id="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="#" class="sidebar-logo">
                    <div class="logo-icon">
                        <i class="fas fa-calculator"></i>
                    </div>
                    <span class="logo-text">BC Systems</span>
                </a>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Principal</div>
                    <a class="nav-item active" data-page="inicio">
                        <i class="fas fa-home"></i>
                        <span>Inicio</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Contabilidad</div>
                    <a class="nav-item" data-page="asientos">
                        <i class="fas fa-book"></i>
                        <span>Asientos Contables</span>
                    </a>
                    <a class="nav-item" data-page="cuentas">
                        <i class="fas fa-wallet"></i>
                        <span>Cuentas Contables</span>
                    </a>
                    <a class="nav-item" data-page="movimientos">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Movimientos</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Operaciones</div>
                    <a class="nav-item" data-page="ventas">
                        <i class="fas fa-shopping-cart"></i>
                        <span>Ventas</span>
                    </a>
                    <a class="nav-item" data-page="compras">
                        <i class="fas fa-shopping-bag"></i>
                        <span>Compras</span>
                    </a>
                    <a class="nav-item" data-page="gastos">
                        <i class="fas fa-receipt"></i>
                        <span>Gastos</span>
                    </a>
                    <a class="nav-item" data-page="nomina">
                        <i class="fas fa-users"></i>
                        <span>Nómina</span>
                    </a>
                </div>
                
                <div class="nav-section">
                    <div class="nav-section-title">Gestión</div>
                    <a class="nav-item" data-page="proveedores">
                        <i class="fas fa-truck"></i>
                        <span>Proveedores</span>
                    </a>
                    <a class="nav-item" data-page="empleados">
                        <i class="fas fa-user-tie"></i>
                        <span>Empleados</span>
                    </a>
                    <a class="nav-item" data-page="comisiones">
                        <i class="fas fa-percent"></i>
                        <span>Comisiones</span>
                    </a>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <div class="user-name" id="userName">Usuario</div>
                        <div class="user-role" id="userRole">Administrador</div>
                    </div>
                    <button class="btn-logout" onclick="auth.logout()" title="Cerrar Sesión">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="topbar-left">
                    <button class="toggle-sidebar" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h1 class="page-title" id="pageTitle">Inicio</h1>
                </div>
                <div class="topbar-right">
                    <div class="topbar-icon">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge"></span>
                    </div>
                    <div class="topbar-icon">
                        <i class="fas fa-cog"></i>
                    </div>
                </div>
            </header>
            
            <!-- Page Content -->
            <div class="page-content" id="pageContent">
                <!-- Content will be loaded dynamically -->
            </div>
        </main>
    </div>
    
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>
    
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>
    
    <!-- Modal Template -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Modal Title</h3>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-primary" id="modalConfirmBtn">Confirmar</button>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
