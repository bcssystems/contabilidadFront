<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-journal-whills me-2" style="color:var(--primary)"></i>Asientos Contables</h4>
      <small class="text-muted">Registro de asientos contables</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoAsiento">
      <i class="fas fa-plus me-1"></i> Nuevo Asiento
    </button>
  </div>

  <div class="filter-bar filter-bar-3cols">
    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-search"></i></span>
      <input type="text" class="form-control" id="searchAsiento" placeholder="Buscar por referencia o descripci&oacute;n...">
    </div>
    <select class="form-select" id="filterTipoAsiento">
      <option value="">Todos los tipos</option>
      <option value="BORRADOR">Borrador</option>
      <option value="CONFIRMADO">Confirmado</option>
      <option value="CANCELADO">Cancelado</option>
    </select>
    <div></div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Referencia</th>
            <th>Descripci&oacute;n</th>
            <th>Tipo</th>
            <th style="width:140px"></th>
          </tr>
        </thead>
        <tbody id="tableAsientosBody">
          <tr><td colspan="6"><div class="empty-state"><i class="fas fa-journal-whills"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationAsientos"></div>
</div>

<div class="modal fade" id="asientoModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="asientoModalTitle">Nuevo Asiento Contable</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formAsiento">
          <input type="hidden" id="asientoId">
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Fecha <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="asientoFecha" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Referencia <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="asientoReferencia" required maxlength="100">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo <span class="text-danger">*</span></label>
              <select class="form-select" id="asientoTipo" required>
                <option value="BORRADOR">Borrador</option>
                <option value="CONFIRMADO">Confirmado</option>
                <option value="CANCELADO">Cancelado</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Descripci&oacute;n <span class="text-danger">*</span></label>
            <textarea class="form-control" id="asientoDescripcion" rows="2" maxlength="500" required></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarAsiento">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="viewAsientoModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="viewAsientoTitle">Asiento #</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="viewAsientoBody"></div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
