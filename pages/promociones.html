<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-percent me-2" style="color:var(--primary)"></i>Promociones y Combos</h4>
      <small class="text-muted">Gesti&oacute;n de promociones y combos</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevaPromocion">
      <i class="fas fa-plus me-1"></i> Nueva Promoci&oacute;n
    </button>
  </div>

  <div class="filter-bar filter-bar-3cols">
    <select class="form-select" id="filterTipo">
      <option value="">Todos los tipos</option>
      <option value="PROMOCION">Promociones</option>
      <option value="COMBO">Combos</option>
    </select>
    <select class="form-select" id="filterActivo">
      <option value="">Todos</option>
      <option value="true">Activos</option>
      <option value="false">Inactivos</option>
    </select>
    <button class="btn btn-outline-secondary ripple" id="btnFiltrar"><i class="fas fa-search me-1"></i> Filtrar</button>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Descuento</th>
            <th>Precio Sugerido</th>
            <th>Precio Final</th>
            <th>Vigencia</th>
            <th>Estado</th>
            <th style="width:100px"></th>
          </tr>
        </thead>
        <tbody id="tablePromocionesBody">
          <tr><td colspan="8"><div class="empty-state"><i class="fas fa-percent"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationPromociones"></div>
</div>

<div class="modal fade" id="promocionModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="promocionModalTitle">Nueva Promoci&oacute;n</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formPromocion">
          <input type="hidden" id="promocionId">
          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="promocionNombre" required maxlength="200">
            </div>
            <div class="col-md-4">
              <label class="form-label">Tipo <span class="text-danger">*</span></label>
              <select class="form-select" id="promocionTipo">
                <option value="PROMOCION">Promoci&oacute;n</option>
                <option value="COMBO">Combo</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Descripci&oacute;n</label>
            <textarea class="form-control" id="promocionDescripcion" rows="2" maxlength="500"></textarea>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-3">
              <label class="form-label">Descuento %</label>
              <input type="number" class="form-control" id="promocionDescuento" min="0" max="100" step="0.01" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha Inicio <span class="text-danger">*</span></label>
              <input type="datetime-local" class="form-control" id="promocionFechaInicio" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Fecha Fin <span class="text-muted">(opcional)</span></label>
              <input type="datetime-local" class="form-control" id="promocionFechaFin">
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="promocionActivo" checked>
                <label class="form-check-label" for="promocionActivo">Activo</label>
              </div>
            </div>
          </div>

          <hr class="my-3">

          <div id="promocionProductoGroup">
            <label class="form-label fw-semibold">Producto</label>
            <select class="form-select" id="promocionProducto">
              <option value="">Seleccionar producto</option>
            </select>
          </div>

          <div id="comboProductosGroup" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <label class="form-label fw-semibold mb-0">Productos del Combo</label>
            </div>
            <div class="row g-2 mb-2">
              <div class="col-md-7">
                <select class="form-select" id="comboProductoSelect"><option value="">Seleccionar producto</option></select>
              </div>
              <div class="col-md-3">
                <input type="number" class="form-control" id="comboProductoCantidad" value="1" min="1">
              </div>
              <div class="col-md-2">
                <button class="btn btn-outline-primary w-100 ripple" id="btnAgregarComboProducto"><i class="fas fa-plus"></i></button>
              </div>
            </div>
            <div class="table-responsive">
              <table class="table table-sm table-custom mb-0">
                <thead><tr><th>Producto</th><th style="width:80px">Cant</th><th style="width:100px">Precio1</th><th style="width:100px">Subtotal</th><th style="width:40px"></th></tr></thead>
                <tbody id="comboProductosTableBody"></tbody>
              </table>
            </div>
          </div>

          <hr class="my-3">

          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Precio Sugerido</label>
              <input type="number" class="form-control" id="promocionPrecioSugerido" step="0.01" readonly>
              <small class="text-muted">Calculado autom&aacute;ticamente</small>
            </div>
            <div class="col-md-6">
              <label class="form-label">Precio Final <span class="text-muted">(editable)</span></label>
              <input type="number" class="form-control" id="promocionPrecioFinal" step="0.01">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarPromocion">Guardar</button>
      </div>
    </div>
  </div>
</div>
