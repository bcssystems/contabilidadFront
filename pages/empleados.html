<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-users me-2" style="color:var(--primary)"></i>Usuarios</h4>
      <small class="text-muted">Administración unificada de usuarios y personal</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoEmpleado">
      <i class="fas fa-plus me-1"></i> Nuevo Usuario
    </button>
  </div>

  <div class="filter-bar filter-bar-2cols">
    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-search"></i></span>
      <input type="text" class="form-control" id="searchEmpleado" placeholder="Buscar usuario...">
    </div>
    <select class="form-select" id="filterPuesto">
      <option value="">Todos los puestos</option>
      <option value="VENDEDOR">Vendedor</option>
      <option value="TECNICO">T&eacute;cnico</option>
      <option value="COBRANZA">Cobranza</option>
    </select>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Puesto</th>
            <th>Sueldo Semanal</th>
            <th>Estado</th>
            <th>Registro</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody id="tableEmpleadosBody">
          <tr><td colspan="8"><div class="empty-state"><i class="fas fa-user-tie"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationEmpleados"></div>
</div>

<div class="modal fade" id="empleadoModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="empleadoModalTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formEmpleado">
          <input type="hidden" id="empleadoId">
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="empleadoNombre" required maxlength="100">
            </div>
            <div class="col-md-4">
              <label class="form-label">Primer Apellido <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="empleadoApellido1" required maxlength="100">
            </div>
            <div class="col-md-4">
              <label class="form-label">Segundo Apellido</label>
              <input type="text" class="form-control" id="empleadoApellido2" maxlength="100">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Tipo de persona</label>
            <select class="form-select" id="empleadoTipoPersona"><option value="EMPLEADO">Empleado</option><option value="USUARIO">Usuario del sistema</option></select>
          </div>
          <div class="mb-3">
            <div class="row g-3">
              <div class="col-md-6"><label class="form-label">Usuario *</label><input type="text" class="form-control" id="empleadoUsername" required></div>
              <div class="col-md-6"><label class="form-label">Contraseña *</label><input type="password" class="form-control" id="empleadoPassword"></div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Rol</label>
            <select class="form-select" id="empleadoRole"><option value="USER">Usuario</option><option value="ADMIN">Administrador</option><option value="ALMACEN">Almacén</option></select>
          </div>
          <div id="datosLaboralesSection">
          <div class="mb-3">
            <label class="form-label">Puesto <span class="text-danger">*</span></label>
            <select class="form-select" id="empleadoPuesto" required>
              <option value="VENDEDOR">Vendedor</option>
              <option value="TECNICO">T&eacute;cnico</option>
              <option value="COBRANZA">Cobranza</option>
            </select>
          </div>
          <div class="mb-3"><label class="form-label">Sueldo semanal</label><input type="number" class="form-control" id="empleadoSueldoSemanal" step="0.01" min="0" required></div>
          <div class="border rounded p-3 mb-3">
            <h6 class="mb-3"><i class="fas fa-calendar-week me-1"></i>Horario semanal</h6>
            <div class="row g-2 mb-2">
              <div class="col-md-6"><label class="form-label small">Nombre del horario</label><input class="form-control form-control-sm" id="empleadoHorarioNombre" value="Horario semanal"></div>
            </div>
            <div id="empleadoHorarioDias"></div>
            <small class="text-muted">El horario se crea y se asigna al usuario al guardar. Las tolerancias son globales y se configuran en Configuración del sistema.</small>
          </div>
          </div>
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="empleadoActivo" checked>
            <label class="form-check-label" for="empleadoActivo">Activo</label>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarEmpleado">Guardar</button>
      </div>
    </div>
  </div>
</div>
