<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-truck me-2" style="color:var(--primary)"></i>Proveedores</h4>
      <small class="text-muted">Gesti&oacute;n de proveedores</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoProveedor">
      <i class="fas fa-plus me-1"></i> Nuevo Proveedor
    </button>
  </div>

  <div class="filter-bar filter-bar-1cols">
    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-search"></i></span>
      <input type="text" class="form-control" id="searchProveedor" placeholder="Buscar proveedor...">
    </div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Cuenta por Pagar</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableProveedoresBody">
          <tr><td colspan="4"><div class="empty-state"><i class="fas fa-truck"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationProveedores"></div>
</div>

<div class="modal fade" id="proveedorModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="proveedorModalTitle">Nuevo Proveedor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formProveedor">
          <input type="hidden" id="proveedorId">
          <div class="mb-3">
            <label class="form-label">Nombre <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="proveedorNombre" required maxlength="200">
          </div>
          <div class="mb-3">
            <label class="form-label">Cuenta por Pagar</label>
            <select class="form-select" id="proveedorCuenta"></select>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarProveedor">Guardar</button>
      </div>
    </div>
  </div>
</div>
