<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-percent me-2" style="color:var(--primary)"></i>Comisiones</h4>
      <small class="text-muted">Gesti&oacute;n de comisiones</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevaComision">
      <i class="fas fa-plus me-1"></i> Nueva Comisi&oacute;n
    </button>
  </div>

  <div class="filter-bar filter-bar-2cols">
    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-search"></i></span>
      <input type="text" class="form-control" id="searchComision" placeholder="Buscar...">
    </div>
    <select class="form-select" id="filterEstadoComision">
      <option value="">Todos los estados</option>
      <option value="PENDIENTE">Pendiente</option>
      <option value="PAGADA">Pagada</option>
      <option value="CANCELADA">Cancelada</option>
    </select>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Tipo</th>
            <th>Monto Base</th>
            <th>%</th>
            <th>Monto Comisi&oacute;n</th>
            <th>Estado</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableComisionesBody">
          <tr><td colspan="7"><div class="empty-state"><i class="fas fa-percent"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationComisiones"></div>
</div>

<div class="modal fade" id="comisionModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="comisionModalTitle">Nueva Comisi&oacute;n</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formComision">
          <input type="hidden" id="comisionId">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Tipo <span class="text-danger">*</span></label>
              <select class="form-select" id="comisionTipo" required>
                <option value="VENTA">Venta</option>
                <option value="COBRANZA">Cobranza</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select class="form-select" id="comisionEstado">
                <option value="PENDIENTE">Pendiente</option>
                <option value="PAGADA">Pagada</option>
                <option value="CANCELADA">Cancelada</option>
              </select>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-4">
              <label class="form-label">Monto Base <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="comisionMontoBase" step="0.01" min="0" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Porcentaje (%) <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="comisionPorcentaje" step="0.01" min="0" max="100" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Monto Comisi&oacute;n</label>
              <input type="text" class="form-control" id="comisionMontoCalc" readonly>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Empleado <span class="text-danger">*</span></label>
            <select class="form-select" id="comisionEmpleado"></select>
          </div>
          <div class="mb-3">
            <label class="form-label">ID Venta</label>
            <input type="number" class="form-control" id="comisionVentaId" min="0">
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarComision">Guardar</button>
      </div>
    </div>
  </div>
</div>
