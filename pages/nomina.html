<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-file-invoice-dollar me-2" style="color:var(--primary)"></i>N&oacute;mina</h4>
      <small class="text-muted">Gesti&oacute;n de n&oacute;mina</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevaNomina">
      <i class="fas fa-plus me-1"></i> Nueva N&oacute;mina
    </button>
  </div>

  <div class="filter-bar filter-bar-2cols">
    <div class="input-group">
      <span class="input-group-text"><i class="fas fa-search"></i></span>
      <input type="text" class="form-control" id="searchNomina" placeholder="Buscar...">
    </div>
    <div></div>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Sueldo</th>
            <th>Empleado ID</th>
            <th>Asiento</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableNominasBody">
          <tr><td colspan="6"><div class="empty-state"><i class="fas fa-file-invoice-dollar"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="mt-3" id="paginationNominas"></div>
</div>

<div class="modal fade" id="nominaModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="nominaModalTitle">Nueva N&oacute;mina</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formNomina">
          <input type="hidden" id="nominaId">
          <div class="alert alert-info"><i class="fas fa-info-circle"></i> El asiento contable se generar&aacute; autom&aacute;ticamente.</div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Fecha <span class="text-danger">*</span></label>
              <input type="date" class="form-control" id="nominaFecha" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Sueldo <span class="text-danger">*</span></label>
              <input type="number" class="form-control" id="nominaSueldo" step="0.01" min="0" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Empleado <span class="text-danger">*</span></label>
            <select class="form-select" id="nominaEmpleado"></select>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarNomina">Guardar</button>
      </div>
    </div>
  </div>
</div>
