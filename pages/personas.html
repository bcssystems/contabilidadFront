<div class="page-content">
  <div class="page-header">
    <div>
      <h4><i class="fas fa-users me-2" style="color:var(--primary)"></i>Usuarios</h4>
      <small class="text-muted">Gesti&oacute;n de usuarios del sistema</small>
    </div>
    <button class="btn btn-primary ripple" id="btnNuevoUsuario">
      <i class="fas fa-plus me-1"></i> Nuevo Usuario
    </button>
  </div>

  <div class="panel-card overflow-hidden">
    <div class="table-responsive">
      <table class="table table-custom mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Nombre</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Registro</th>
            <th style="width:120px"></th>
          </tr>
        </thead>
        <tbody id="tableUsuariosBody">
          <tr><td colspan="7"><div class="empty-state"><i class="fas fa-users"></i><p>Cargando...</p></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="usuarioModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="usuarioModalTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="formUsuario">
          <input type="hidden" id="usuarioId">
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="usuarioNombre" required maxlength="100">
            </div>
            <div class="col-md-6">
              <label class="form-label">Primer Apellido <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="usuarioApellido1" required maxlength="100">
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Segundo Apellido</label>
              <input type="text" class="form-control" id="usuarioApellido2" maxlength="100">
            </div>
            <div class="col-md-6">
              <label class="form-label">Tipo Persona</label>
              <select class="form-select" id="usuarioTipoPersona">
                <option value="USUARIO">Usuario</option>
                <option value="EMPLEADO">Empleado</option>
              </select>
            </div>
          </div>
          <div class="row g-3 mb-3" id="credencialesSection">
            <div class="col-md-6">
              <label class="form-label">Usuario (email) <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="usuarioUsername" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contrase&ntilde;a <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="usuarioPassword" required>
            </div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Rol <span class="text-danger">*</span></label>
              <select class="form-select" id="usuarioRol" required>
                <option value="USER">Usuario</option>
                <option value="ALMACEN">Almac&eacute;n</option>
                <option value="ADMIN">Administrador</option>
              </select>
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <div class="form-check">
                <input type="checkbox" class="form-check-input" id="usuarioActivo" checked>
                <label class="form-check-label" for="usuarioActivo">Activo</label>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary px-4 ripple" id="btnGuardarUsuario">Guardar</button>
      </div>
    </div>
  </div>
</div>
