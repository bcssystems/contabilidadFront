<div class="page-content maker-page">
  <style>
    /* Overrides locales de Maker: se cargan junto con la vista para evitar estilos cacheados. */
    .maker-page .maker-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:100%;margin:1.25rem 0 1rem}
    .maker-page .maker-toolbar>.btn{margin-left:auto;flex:0 0 auto;white-space:nowrap}
    .maker-page .maker-settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;padding:.5rem}
    .maker-page .maker-setting-card{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;min-height:108px;padding:1.35rem 1.5rem;margin:0}
    .maker-page .maker-setting-info{display:flex;flex:1;min-width:0;flex-direction:column;gap:.35rem;padding:0}
    .maker-page .maker-setting-info span{font-size:.95rem;font-weight:700;line-height:1.25;text-transform:none}
    .maker-page .maker-setting-info small{font-size:.72rem;line-height:1.4;text-transform:none}
    .maker-page .maker-setting-input{width:155px;max-width:155px;flex:0 0 155px}
    .maker-page .maker-table-actions{display:flex;justify-content:flex-end;align-items:center;min-width:42px}
    .maker-page .maker-table-kebab{width:34px;height:34px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--text-muted);display:inline-flex;align-items:center;justify-content:center}
    .maker-page .form-text{color:var(--text-secondary)!important}
    .maker-page .maker-kanban{display:flex;flex-wrap:nowrap;align-items:stretch;gap:1.25rem;width:100%;overflow-x:auto;overflow-y:hidden;padding:.5rem .25rem 1.25rem}
    .maker-page .maker-column{display:flex;flex:1 1 0;flex-direction:column;min-width:0;min-height:470px;padding:1rem;border-radius:16px;background:linear-gradient(180deg,rgba(30,41,59,.8),rgba(15,23,42,.55))}
    .maker-page .maker-column-body{display:flex;flex:1;flex-direction:column;gap:.75rem}
    .maker-page .maker-board-card{width:100%;margin:0}
    .maker-page .maker-kanban .maker-column-body{display:flex!important;flex:1 1 auto!important;flex-direction:column!important;gap:1rem!important}
    .maker-page .maker-kanban .maker-board-card{display:flex!important;position:relative!important;flex-direction:column!important;width:100%!important;min-height:230px!important;padding:1rem!important;border:1px solid rgba(148,163,184,.28)!important;border-top:4px solid var(--card-color)!important;border-radius:16px!important;background:linear-gradient(145deg,#1e293b,#0f172a)!important;box-shadow:0 10px 24px rgba(2,6,23,.28)!important;overflow:hidden!important}
    .maker-page .maker-kanban .maker-board-card:hover{transform:translateY(-3px);border-color:var(--card-color)!important;box-shadow:0 16px 32px rgba(2,6,23,.4)!important}
    .maker-page .maker-kanban .maker-card-title{display:block!important;width:100%!important;padding:.7rem 0 .4rem!important;color:#f8fafc!important;font-size:1rem!important;font-weight:800!important;line-height:1.3!important}
    .maker-page .maker-kanban .maker-card-description{display:-webkit-box!important;min-height:2.5rem;margin:0 0 .8rem;color:#cbd5e1!important;line-height:1.5;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .maker-page .maker-kanban .maker-project-card-info{display:flex;flex-direction:column;gap:.45rem;margin-bottom:.8rem}
    .maker-page .maker-kanban .maker-card-chip{display:block;color:#94a3b8!important;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .maker-page .maker-kanban .maker-card-progress{margin-top:auto;padding-top:.7rem;border-top:1px solid rgba(148,163,184,.2)}
    .maker-page .maker-kanban .maker-progress-track{height:6px;overflow:hidden;border-radius:99px;background:rgba(148,163,184,.2)}
    .maker-page .maker-kanban .maker-progress-track span{display:block;height:100%;border-radius:inherit;background:var(--card-color)}
    @media(max-width:1200px){.maker-page .maker-column{flex:0 0 290px;min-width:290px}}
    @media(max-width:767.98px){
      .maker-page{width:100%;max-width:100%;padding:0 .75rem 1.25rem;overflow:hidden}
      .maker-page .maker-hero{min-height:132px;margin-bottom:.85rem;padding:1rem}
      .maker-page .maker-hero-mark{display:none}
      .maker-page .maker-tabs{margin-left:-.75rem;margin-right:-.75rem;padding:0 .75rem;overflow-x:auto;flex-wrap:nowrap}
      .maker-page .maker-grid{display:flex;flex-direction:column;gap:.85rem;margin-top:.85rem}
      .maker-page .maker-form-card,.maker-page .maker-result-card{width:100%;padding:.9rem}
      .maker-page .maker-toolbar{align-items:stretch;flex-direction:column;gap:.7rem;margin:.9rem 0 .75rem}
      .maker-page .maker-toolbar>.btn{width:100%;margin-left:0}
      .maker-page .maker-form-actions{display:flex;flex-direction:column;gap:.55rem}
      .maker-page .maker-form-actions .btn{width:100%;min-height:42px}
      .maker-page .maker-line-row{grid-template-columns:1fr!important;gap:.5rem;margin-bottom:.75rem}
      .maker-page .maker-filament-row .maker-line-index{display:none}
      .maker-page .maker-settings-grid{grid-template-columns:1fr;padding:.25rem;gap:.75rem}
      .maker-page .maker-setting-card{align-items:stretch;flex-direction:column;gap:1rem;min-height:0;padding:1rem}
      .maker-page .maker-setting-input{width:100%;max-width:none;flex-basis:auto}
      .maker-page .maker-kanban{gap:.75rem;width:calc(100% + .5rem);margin:0 -.25rem;padding:.35rem .25rem 1rem;scroll-snap-type:x proximity}
      .maker-page .maker-column{flex:0 0 84vw;min-width:84vw;min-height:410px;padding:.8rem;scroll-snap-align:start}
      .maker-page .maker-table{min-width:680px}
      .maker-page .maker-detail-grid{grid-template-columns:1fr}
      .maker-page .maker-detail-actions{display:flex;flex-direction:column;gap:.5rem}
      .maker-page .maker-detail-actions .btn{width:100%}
    }
    @media(max-width:380px){.maker-page{padding-left:.55rem;padding-right:.55rem}.maker-page .maker-column{flex-basis:86vw;min-width:86vw}}
  </style>
  <div class="maker-hero">
    <div>
      <div class="maker-eyebrow"><i class="fas fa-cubes me-2"></i>WORKSHOP DIGITAL</div>
      <h2>Maker</h2>
      <p>Calcula costos reales de tus impresiones 3D y conserva cada cotización.</p>
    </div>
    <div class="maker-hero-mark"><i class="fas fa-cube"></i></div>
  </div>

  <ul class="nav nav-tabs maker-tabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-maker-tab="calculator"><i class="fas fa-calculator me-2"></i>Calculadora</button></li>
    <li class="nav-item"><button class="nav-link" data-maker-tab="quotes"><i class="fas fa-clock-rotate-left me-2"></i>Cotizaciones</button></li>
    <li class="nav-item"><button class="nav-link" data-maker-tab="projects"><i class="fas fa-diagram-project me-2"></i>Proyectos</button></li>
    <li class="nav-item"><button class="nav-link" data-maker-tab="tasks"><i class="fas fa-list-check me-2"></i>Tareas</button></li>
    <li class="nav-item"><button class="nav-link" data-maker-tab="filaments"><i class="fas fa-fill-drip me-2"></i>Filamentos</button></li>
    <li class="nav-item"><button class="nav-link" data-maker-tab="materials"><i class="fas fa-layer-group me-2"></i>Materiales</button></li>
    <li class="nav-item"><button class="nav-link" data-maker-tab="settings"><i class="fas fa-sliders me-2"></i>Configuración</button></li>
  </ul>

  <section id="maker-calculator" class="maker-tab-panel"></section>
  <section id="maker-quotes" class="maker-tab-panel d-none"></section>
  <section id="maker-projects" class="maker-tab-panel d-none"></section>
  <section id="maker-tasks" class="maker-tab-panel d-none"></section>
  <section id="maker-filaments" class="maker-tab-panel d-none"></section>
  <section id="maker-materials" class="maker-tab-panel d-none"></section>
  <section id="maker-settings" class="maker-tab-panel d-none"></section>

  <div class="modal fade" id="makerDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title"><i class="fas fa-receipt me-2 text-primary"></i>Detalle de cotización</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="makerDetailBody"></div>
    </div></div>
  </div>
  <div class="modal fade" id="makerCatalogModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="makerCatalogTitle">Nuevo registro</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="makerCatalogBody"></div>
      <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" id="makerCatalogSave">Guardar</button></div>
    </div></div>
  </div>
</div>
